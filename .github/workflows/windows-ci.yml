name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart sources
        run: flutter analyze lib test
      - name: Run Flutter tests
        run: flutter test
      - name: Build Windows host
        run: flutter build windows
      - name: Verify packaged output exists
        shell: powershell
        run: |
          $exe = "build\windows\x64\runner\Release\androiddex_host.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Write-Host "Packaged host OK: $exe"
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: androiddex-host-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
