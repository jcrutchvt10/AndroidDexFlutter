name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build native controller
        shell: pwsh
        run: |
          cmake -S rewritedex-native/native-controller -B rewritedex-native/build-ci -G Ninja
          cmake --build rewritedex-native/build-ci
      - name: Test and build Android agent
        working-directory: rewritedex-native/android-agent
        run: cmd /c gradlew.bat :app:testDebugUnitTest :app:assembleDebug
