# ---------------------------------------------------------------------------
# Meson cross-compile config: WSL2 Linux (build host) → Windows x64 (target).
#
# Used by:
#   meson setup --cross-file scripts/wsl-mingw-cross.ini ...
#
# Hard requirement that the toolchain tools above are installed via
# scripts/wsl-install-toolchain.sh.
# ---------------------------------------------------------------------------

[binaries]
c         = 'x86_64-w64-mingw32-gcc'
cpp       = 'x86_64-w64-mingw32-g++'
ar        = 'x86_64-w64-mingw32-ar'
strip     = 'x86_64-w64-mingw32-strip'
windres   = 'x86_64-w64-mingw32-windres'
pkgconfig = 'x86_64-w64-mingw32-pkg-config'

[host_machine]
system     = 'windows'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[built-in options]
c_args       = []
c_link_args  = []
cpp_args     = []
cpp_link_args = []
